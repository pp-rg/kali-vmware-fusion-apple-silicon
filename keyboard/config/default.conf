[ids]
*

[main]
leftalt = layer(option)
rightalt = layer(option)
leftmeta = layer(cmd)
rightmeta = layer(cmd)

[option:G]
left = C-left
right = C-right
up = C-up
down = C-down
backspace = C-backspace
delete = C-delete

[option+shift]
left = C-S-left
right = C-S-right
up = C-S-up
down = C-S-down

[cmd:C]
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home backspace)
# Cmd+Tab: Alt stays held while Cmd is held, so repeated Tab cycles windows
tab = swapm(appswitch, A-tab)

[cmd+shift]
tab = swapm(appswitch, A-S-tab)
left = S-home
right = S-end
up = C-S-home
down = C-S-end

# layer active while cycling windows (Alt held); Cmd+Shift+Tab goes backwards
[appswitch:A]
tab = A-tab

[appswitch+shift]
tab = A-S-tab
